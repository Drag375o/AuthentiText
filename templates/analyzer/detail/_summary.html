<section class="bento-card mt-4" aria-labelledby="summary-heading">
  <h2 id="summary-heading" class="label">In plain language</h2>
  <p class="font-display font-bold text-2xl text-ink mt-3">{{ summary.headline }}</p>

  <dl class="mt-6 divide-y divide-rule border-t border-rule">
    {% for point in summary.points %}
      <div class="grid gap-x-8 gap-y-1 py-3 sm:grid-cols-[10rem_minmax(0,1fr)]">
        <dt class="meta pt-1">{{ point.label }}</dt>
        <dd class="text-graphite leading-relaxed text-justify hyphens-auto">{{ point.text }}</dd>
      </div>
    {% endfor %}
  </dl>
</section>
