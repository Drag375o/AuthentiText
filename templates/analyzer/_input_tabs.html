{# Hidden until upload.js turns the two panels into tabs; without JS both panels show. #}
<div class="hidden" role="tablist" aria-label="How to add your text" data-tabs>
  <div class="inline-flex rounded-md border border-rule bg-fog p-1">
    <button type="button" role="tab" id="tab-write" aria-controls="panel-write" aria-selected="true" class="tab" data-tab="write">Write or paste</button>
    <button type="button" role="tab" id="tab-upload" aria-controls="panel-upload" aria-selected="false" tabindex="-1" class="tab" data-tab="upload">Upload a file</button>
  </div>
</div>
