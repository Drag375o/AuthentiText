<form method="get" class="mt-10 bento-card" aria-label="Choose two documents">
  <div class="grid gap-5 md:grid-cols-[minmax(0,1fr)_minmax(0,1fr)_auto] md:items-end">
    <div>
      <label for="pick-a" class="label block">Document A</label>
      <select id="pick-a" name="a" class="field-input mt-2">
        <option value="">Choose a document…</option>
        {% for item in analyses %}
          <option value="{{ item.pk }}" {% if choices.a == item.pk|stringformat:"s" %}selected{% endif %}>{{ item.display_name }} · {{ item.created_at|date:"j M Y" }}</option>
        {% endfor %}
      </select>
    </div>
    <div>
      <label for="pick-b" class="label block">Document B</label>
      <select id="pick-b" name="b" class="field-input mt-2">
        <option value="">Choose a document…</option>
        {% for item in analyses %}
          <option value="{{ item.pk }}" {% if choices.b == item.pk|stringformat:"s" %}selected{% endif %}>{{ item.display_name }} · {{ item.created_at|date:"j M Y" }}</option>
        {% endfor %}
      </select>
    </div>
    <button type="submit" class="btn-primary md:mb-0">Compare</button>
  </div>
</form>
